<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>avision</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%23166534' stroke-width='5'/%3E%3Cellipse cx='50' cy='50' rx='26' ry='13' fill='none' stroke='%2314160f' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23166534'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff; --soft:#fafaf8; --hover:#f4f5f2;
    --line:#e4e4de; --line-hard:#d2d2ca;
    --text:#14160f; --dim:#5c6055; --faint:#8d9086;
    --accent:#166534; --accent-soft:#eaf2ed;
    --green-deep:#0a3320; --green-bright:#15803d;
    --warn:#a5601a; --warn-soft:#fdf3e7;
    --danger:#9b2c2c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;}
  ::selection{background:var(--accent); color:#fff;}
  button{font-family:inherit;}

  .eye-lid{transform-box:view-box; transform-origin:50% 50%; animation:blink 6s infinite;}
  @keyframes blink{0%,41%,100%{transform:scaleY(1);}43%{transform:scaleY(.06);}45.5%{transform:scaleY(1);}
    88%{transform:scaleY(1);}90%{transform:scaleY(.06);}92.5%{transform:scaleY(1);}}
  .pupil{transform-box:view-box; transform-origin:50% 50%; animation:look 7s ease-in-out infinite;}
  @keyframes look{0%,18%{transform:translateY(0);}32%,52%{transform:translateY(-6px);}66%,100%{transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.eye-lid,.pupil{animation:none;}}


  /* ============ HERO ============ */
  .hero{position:relative; margin:0 0 26px; border:1px solid var(--line); border-radius:14px;
    overflow:hidden; background:#0a0f12; line-height:0;}
  .heroart{display:block; width:100%; height:clamp(150px,21vw,240px);}
  @media (max-width:760px){ .heroart{height:auto; aspect-ratio:1024/280;} }

  .av-orbit{transform-origin:215px 128px; animation:avSpin 26s linear infinite;}
  .av-orbit2{transform-origin:215px 128px; animation:avSpin 38s linear infinite reverse;}
  @keyframes avSpin{to{transform:rotate(360deg);}}

  .av-bulbglow{animation:avBulb 4.2s ease-in-out infinite;}
  @keyframes avBulb{0%,100%{opacity:.20;}50%{opacity:.52;}}

  .av-ecg{stroke-dasharray:52 52; animation:avEcg 2.6s linear infinite;}
  @keyframes avEcg{from{stroke-dashoffset:104;}to{stroke-dashoffset:0;}}

  .av-q{animation:avQ 4.2s ease-in-out infinite;}
  @keyframes avQ{0%,100%{opacity:.25;}45%{opacity:.85;}}

  .av-flow{fill:none; stroke:url(#avFlow); stroke-linecap:round; mix-blend-mode:screen;}
  .av-flowbase{stroke-width:10; filter:url(#avBlur); animation:avBreathe 5s ease-in-out infinite;}
  .av-f1{stroke-width:2.6; stroke-dasharray:74 210; animation:avDash 3.4s linear infinite;}
  .av-f2{stroke-width:1.6; stroke-dasharray:48 236; animation:avDash 5s linear infinite; opacity:.8;}
  .av-f3{stroke-width:1.2; stroke-dasharray:30 254; animation:avDash 7s linear infinite; opacity:.6;}
  @keyframes avDash{to{stroke-dashoffset:-284;}}
  @keyframes avBreathe{0%,100%{opacity:.30;}50%{opacity:.62;}}

  .av-facet{animation:avFacet 6s ease-in-out infinite;}
  .av-facet:nth-of-type(2n){animation-delay:1.4s;}
  .av-facet:nth-of-type(3n){animation-delay:2.7s;}
  @keyframes avFacet{0%,100%{opacity:.30;}50%{opacity:.72;}}

  .av-gemglow{animation:avGem 4.6s ease-in-out infinite;}
  @keyframes avGem{0%,100%{opacity:.35; transform:scale(1);}50%{opacity:.8; transform:scale(1.06);}}
  .av-gemwrap{transform-origin:822px 150px;}

  .av-check{stroke-dasharray:56; stroke-dashoffset:56; animation:avCheck 5.2s ease-in-out infinite;}
  @keyframes avCheck{0%{stroke-dashoffset:56;}22%,72%{stroke-dashoffset:0;}94%,100%{stroke-dashoffset:56;}}

  .av-trace{animation:avTrace 3.6s ease-in-out infinite;}
  .av-trace:nth-of-type(2n){animation-delay:1.2s;}
  .av-trace:nth-of-type(3n){animation-delay:2.1s;}
  @keyframes avTrace{0%,100%{opacity:.22;}50%{opacity:.6;}}

  .av-spark{fill:#ffe7ab;}
  @media (prefers-reduced-motion: reduce){
    .heroart *{animation:none !important;}
    .av-check{stroke-dashoffset:0;}
  }
  .herocap{padding:15px 18px 13px; border-top:1px solid var(--line); background:var(--bg); line-height:1.5;}
  .hq{font-size:16px; line-height:1.55; font-style:italic; color:var(--text); max-width:760px;}
  .hq .hqa{display:block; margin-top:6px; font-style:normal; font-size:12px; letter-spacing:.06em; color:var(--dim);}
  .hqempty{font-size:14px; color:var(--faint); font-style:italic; background:none; border:none; padding:0;
    cursor:pointer; font-family:inherit; text-align:left;}
  .hqempty:hover{color:var(--accent);}
  .hqrow{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:12px;}
  .hqtag{font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--faint);}
  .hqnext{width:28px; height:28px; flex:none; border-radius:50%; border:1px solid var(--line-hard);
    background:#fff; color:var(--dim); font-size:14px; line-height:1; cursor:pointer; transition:.14s;}
  .hqnext:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  @media (prefers-reduced-motion: reduce){
    .herofx .flow, .herofx .spark{animation:none !important;}
    .herofx animateMotion{display:none;}
  }

  /* ============ TOP BAR ============ */
  #app{display:block;}
  header.top{position:sticky; top:0; z-index:60; background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .topin{max-width:1180px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; gap:24px; height:60px;}
  .brand{display:flex; align-items:center; gap:9px; flex-shrink:0;}
  .brand svg{width:26px; height:26px;}
  .brand span{font-size:16px; font-weight:650; letter-spacing:-.01em;}
  .tabs{display:flex; align-items:center; gap:2px; flex:1; min-width:0; overflow-x:auto; height:60px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{background:none; border:none; border-bottom:2px solid transparent; color:var(--dim);
    font-size:13.5px; padding:0 12px; height:60px; cursor:pointer; white-space:nowrap; transition:.14s;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
  .tab.plus{color:var(--faint); font-size:16px; padding:0 10px;}
  .tab.plus:hover{color:var(--accent);}
  .topacts{display:flex; gap:7px; flex-shrink:0;}
  .tbtn{background:#fff; border:1px solid var(--line-hard); color:var(--dim); font-size:11.5px;
    padding:6px 11px; border-radius:6px; cursor:pointer; transition:.15s;}
  .tbtn:hover{border-color:var(--accent); color:var(--accent);}

  main{max-width:1180px; margin:0 auto; padding:34px 28px 100px;}

  /* ============ PAGE HEAD ============ */
  .phead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
  .ptitle h1{font-size:27px; font-weight:650; letter-spacing:-.02em;}
  .ptitle .psub{color:var(--dim); font-size:13.5px; margin-top:5px;}
  .ptitle input.h1edit{font-size:27px; font-weight:650; letter-spacing:-.02em; border:none; outline:none;
    background:none; color:var(--text); width:100%; font-family:inherit; padding:0;}
  .ptitle input.subedit{font-size:13.5px; color:var(--dim); border:none; outline:none; background:none;
    width:100%; font-family:inherit; margin-top:5px; padding:0;}
  .ptitle input:focus{background:var(--hover); border-radius:4px;}
  .pacts{display:flex; gap:8px;}
  .btn{background:var(--accent); border:1px solid var(--accent); color:#fff; font-size:12.5px;
    padding:7px 14px; border-radius:6px; cursor:pointer; transition:.15s;}
  .btn:hover{background:#124f29;}
  .btn.ghost{background:#fff; color:var(--dim); border-color:var(--line-hard);}
  .btn.ghost:hover{color:var(--accent); border-color:var(--accent);}
  .btn.danger{background:#fff; color:var(--danger); border-color:var(--line-hard);}
  .btn.danger:hover{background:var(--danger); color:#fff; border-color:var(--danger);}

  /* ============ STATS ============ */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px;
    background:rgba(10,51,32,.14); border:1px solid rgba(10,51,32,.14); border-radius:9px;
    overflow:hidden; margin-bottom:34px;}
  .stat{background:#fff; padding:16px 18px; border-top:3px solid var(--green-deep);}
  .stat .n{font-size:24px; font-weight:700; letter-spacing:-.02em;}
  .stat .n.acc{color:var(--green-bright);}
  .stat .l{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin-top:4px;}

  /* ============ BLOCK ============ */
  .block{margin-bottom:34px;}
  .bhead{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bhead h2{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--text); font-weight:700;}
  .bhead .count{font-size:10px; color:#fff; background:var(--green-bright); border-radius:10px;
    padding:1px 7px; font-weight:700;}
  .bhead .rule{flex:1; height:2px; background:var(--green-deep); opacity:.16;}
  .bhead h2.gedit{border:none; outline:none; background:none; font-family:inherit;}
  .bhead h2.gedit:focus{background:var(--hover);}
  .bhead .del{margin-left:auto;}

  /* ============ TABLE ============ */
  .tw{border:1px solid rgba(10,51,32,.16); border-radius:9px; overflow:hidden; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{background:var(--green-deep); text-align:left; font-size:10px; letter-spacing:.13em;
    text-transform:uppercase; color:rgba(255,255,255,.78); font-weight:700; padding:11px 14px;
    border-bottom:none; white-space:nowrap; cursor:pointer; user-select:none;}
  thead th:hover{color:#fff;}
  thead th .car{opacity:.45; font-size:9px; margin-left:3px;}
  tbody tr{border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--hover);}
  tbody td{padding:11px 14px; vertical-align:middle;}
  td.c-name{font-size:14px;}
  td.c-name .tag{display:inline-block; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    color:#fff; background:var(--green-deep); border-radius:4px; padding:3px 7px; margin-right:9px;
    font-weight:700; vertical-align:1px;}
  td.c-name .nm{color:var(--text);}
  td.c-name .nt{color:var(--faint); font-size:12px; margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:420px;}
  td.c-owner{color:var(--dim); white-space:nowrap;}
  td.c-due{white-space:nowrap; color:var(--dim);}
  td.c-due .over{color:var(--danger); font-weight:600;}
  td.c-due .soon{color:var(--warn); font-weight:600;}
  td.c-prog{width:150px;}
  td.c-step{color:var(--faint); font-size:12px; max-width:230px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pw{display:flex; align-items:center; gap:9px;}
  .bar{height:7px; flex:1; min-width:54px; background:#e0e0d8; border-radius:4px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--green-bright); transition:width .25s;}
  .bar.full i{background:var(--green-deep);}
  .pct{font-size:11.5px; color:var(--text); min-width:32px; text-align:right; font-weight:600;}
  .emptyrow td{color:var(--faint); font-size:13px; padding:20px 14px; text-align:center;}

  /* pill + quote sections */
  .pillwrap{display:flex; flex-wrap:wrap; gap:8px;}
  .pillitem{display:flex; align-items:center; gap:5px; border:1px solid var(--line-hard);
    border-radius:20px; padding:5px 9px 5px 13px; font-size:12px; color:var(--dim);}
  .quotecard{border-left:3px solid var(--accent); background:var(--soft); padding:14px 18px;
    border-radius:0 8px 8px 0; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start;}
  .quotecard .q{flex:1; font-style:italic; color:var(--dim); font-size:14.5px; line-height:1.6;}
  .xbtn{background:none; border:none; color:#c8cac2; font-size:15px; cursor:pointer; padding:0 3px; line-height:1;}
  .xbtn:hover{color:var(--danger);}

  /* ============ DRAWER ============ */
  #scrim{position:fixed; inset:0; background:rgba(20,22,15,.3); z-index:90; display:none;}
  #scrim.show{display:block;}
  #drawer{position:fixed; top:0; right:0; height:100%; width:470px; max-width:100%;
    background:#fff; border-left:3px solid var(--accent); z-index:100;
    transform:translateX(100%); transition:transform .24s ease; display:flex; flex-direction:column;
    box-shadow:-8px 0 34px rgba(0,0,0,.12);}
  #drawer.show{transform:translateX(0);}
  .dhead{padding:20px 24px 14px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:12px;}
  .dhead .dwhere{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:7px;}
  .dbody{flex:1; overflow-y:auto; padding:20px 24px 30px;}
  .dfoot{border-top:1px solid var(--line); padding:13px 24px; display:flex; justify-content:space-between; align-items:center;}
  .fld{margin-bottom:17px;}
  .fld label{display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); font-weight:600; margin-bottom:6px;}
  .fld input[type=text], .fld input[type=date], .fld textarea{
    width:100%; border:1px solid var(--line-hard); border-radius:7px; padding:9px 11px;
    font-family:inherit; font-size:13.5px; color:var(--text); background:#fff; outline:none;}
  .fld input:focus, .fld textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .fld textarea{resize:vertical; min-height:70px; line-height:1.55;}
  .fld input.big{font-size:16px; font-weight:600; padding:10px 12px;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .prow{display:flex; align-items:center; gap:13px;}
  .prow input[type=range]{flex:1; accent-color:var(--accent); cursor:pointer;}
  .prow .pv{font-size:15px; font-weight:650; color:var(--accent); min-width:44px; text-align:right;}

  .steps{border-top:1px solid var(--line); margin-top:6px; padding-top:4px;}
  .step{padding:10px 0; border-bottom:1px dashed var(--line);}
  .step:last-of-type{border-bottom:none;}
  .step .sm{display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:5px;}
  .step .sd{font-size:11px; color:var(--faint);}
  .step .sw{font-size:11px; color:var(--accent); font-weight:600;}
  .step .stx{font-size:13.5px; line-height:1.5; color:var(--text);}
  .step input{width:100%; border:1px solid transparent; background:none; font-family:inherit; outline:none;
    border-radius:5px; padding:3px 5px; color:inherit; font-size:inherit;}
  .step input:hover{background:var(--hover);}
  .step input:focus{background:#fff; border-color:var(--accent);}
  .step .srow{display:flex; gap:8px; align-items:center;}
  .nosteps{color:var(--faint); font-size:12.5px; padding:10px 0;}

  /* ============ TOAST / DIALOG ============ */
  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(18px);
    background:var(--text); color:#fff; font-size:13px; padding:11px 20px; border-radius:8px;
    opacity:0; pointer-events:none; transition:.2s; z-index:500; box-shadow:0 8px 26px rgba(0,0,0,.2);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast .tk{color:#7fd6a0; margin-right:8px;}
  #confirmWrap{position:fixed; inset:0; z-index:600; background:rgba(20,22,15,.34);
    display:none; align-items:center; justify-content:center; padding:24px;}
  #confirmWrap.show{display:flex;}
  .cbox{background:#fff; border-radius:12px; padding:25px 26px 20px; max-width:390px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .cbox h3{font-size:16px; font-weight:650; margin-bottom:8px;}
  .cbox p{color:var(--dim); font-size:13.5px; line-height:1.6; margin-bottom:20px;}
  .cbtns{display:flex; gap:10px; justify-content:flex-end;}
  .cinput{width:100%; border:1px solid var(--line-hard); border-radius:7px; padding:10px 12px;
    font-family:inherit; font-size:14px; margin-bottom:18px; outline:none;}
  .cinput:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

  @media (max-width:820px){
    .topin{padding:0 16px; gap:14px; height:56px;}
    .brand span{display:none;}
    .tab{height:56px; padding:0 10px;}
    .tabs{height:56px;}
    .topacts .tbtn.hideSm{display:none;}
    main{padding:24px 16px 90px;}
    .ptitle h1{font-size:23px;}
    td.c-owner, td.c-step, th.h-owner, th.h-step{display:none;}
    td.c-prog{width:100px;}
    td.c-name .nt{max-width:190px;}
    tbody td{padding:10px 10px;}
    thead th{padding:8px 10px;}
    .two{grid-template-columns:1fr;}
    #drawer{width:100%; border-left:none; border-top:3px solid var(--accent);}
  }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="topin">
      <div class="brand">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" stroke="#166534" stroke-width="4"/>
          <g class="eye-lid">
            <ellipse cx="50" cy="50" rx="30" ry="15" fill="none" stroke="#14160f" stroke-width="3"/>
            <circle class="pupil" cx="50" cy="50" r="9" fill="#166534"/>
          </g>
        </svg>
        <span>avision</span>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="topacts">
        <button class="tbtn hideSm" id="exportBtn">Backup</button>
        <button class="tbtn hideSm" id="importBtn">Restore</button>
        <input type="file" id="fileInput" accept="application/json" style="display:none">
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead">
    <div style="flex:1">
      <div class="dwhere" id="dWhere"></div>
      <div class="fld" style="margin:0">
        <input type="text" class="big" id="dTitle" placeholder="Name">
      </div>
    </div>
    <button class="xbtn" id="dClose" style="font-size:20px">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <button class="btn danger" id="dDelete">Delete</button>
    <button class="btn" id="dDone">Done</button>
  </div>
</aside>

<div id="toast"></div>
<div id="confirmWrap">
  <div class="cbox">
    <h3 id="cTitle"></h3>
    <p id="cBody"></p>
    <input class="cinput" id="cInput" style="display:none">
    <div class="cbtns">
      <button class="btn ghost" id="cCancel">Cancel</button>
      <button class="btn" id="cOk">Confirm</button>
    </div>
  </div>
</div>

<script>
var KEY = 'avision-data-v4';

function I(v,k,s,when,who,prog,due){
  return {v:v||'', k:k||'', s:s||'', when:when||'', who:who||'', prog:prog||0, due:due||'', log:[]};
}

var DEFAULTS = { sections:[
  { id:'ventures', nav:'Ventures', title:'Ventures', sub:'Everything in motion or planned.', kind:'rows', items:[
    I('Vision Care','Core','Eyecare in Nepal. 90% automation, plus a flagship eyecare website.','Ongoing','Ashesh',20),
    I('Highgaze Optics','Core','AI-forward product. Future distribution into Bangladesh and other markets.','Ongoing','Ashesh',20),
    I('CLIFF Eyewear','Core','Going global — 5 countries in 2 years, 10+ in 5.','Ongoing','Ashesh',15),
    I('Elistro','2 years','A reputed eyewear brand carrying CLIFF lenses and frames.','2028','',0),
    I('Purpose Circle','New','Connecting elderly people in Nepal with children of families abroad. Elderly-staffed — visits, shared dinners, service, escorting.','TBD','',0),
    I('Roads · Water · Health','10 years','Potholes and road cleaning, water filtration and sewage, affordable rural healthcare.','2036','',0)
  ]},
  { id:'goals', nav:'Goals', title:'Goals', sub:'Where this is all going.', kind:'groups', groups:[
    { title:'One year', items:[
      I('Meaningful progress toward 90% automation across Highgaze, Vision Care and CLIFF','','','2027','Ashesh',15),
      I('Move the Nepal eyecare website from idea to build','','','2027','',5)]},
    { title:'Two years', items:[
      I('CLIFF live in at least 5 countries','','','2028','',0),
      I('Elistro launched — eyewear brand carrying CLIFF lenses and frames','','','2028','',0),
      I('Highgaze AI milestone reached, great product shipped','','','2028','',0)]},
    { title:'Five years', items:[
      I('CLIFF a global brand — at least 10 countries','','','2031','',0),
      I('Highgaze distribution live in Bangladesh and beyond','','','2031','',0)]},

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function norm(x){
  if (typeof x === 'string') return I(x);
  if (!x || typeof x !== 'object') return I('');
  return { v:x.v||'', k:x.k||'', s:x.s||'', when:x.when||'', who:x.who||'',
           prog:Number(x.prog)||0, due:x.due||'', log:Array.isArray(x.log)?x.log:[] };
}
function normalizeAll(d){
  d.sections = (d.sections||[]).filter(function(s){ return s.kind !== 'dashboard'; });
  d.sections.forEach(function(sec){
    if (sec.kind === 'lines' || sec.kind === 'groups-lines') sec.kind = sec.groups ? 'groups' : 'rows';
    if (sec.kind === 'groups-rows') sec.kind = 'groups';
    if (sec.style === 'quote') sec.kind = 'quotes';
    if (sec.style === 'pill') sec.kind = 'pills';
    if (!sec.kind) sec.kind = 'rows';
    if (sec.items) sec.items = sec.items.map(norm);
    if (sec.groups) sec.groups.forEach(function(g){ g.items = (g.items||[]).map(norm); });
    if (sec.kind === 'groups' && !sec.groups) sec.groups = [];
    if (sec.kind !== 'groups' && !sec.items) sec.items = [];
  });
  return d;
}

function el(t,c,h){ var n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; }
function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function parseDue(s){
  if (!s) return null;
  var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!p) return null;
  var d = new Date(Number(p[1]), Number(p[2])-1, Number(p[3]));
  d.setHours(0,0,0,0);
  return d;
}
function fmtDue(s){
  var d = parseDue(s); if (!d) return '';
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
}
function daysTo(s){
  var d = parseDue(s); if (!d) return null;
  return Math.round((d - today0()) / 86400000);
}
function nowStamp(){
  var d = new Date(), hh=d.getHours(), mm=d.getMinutes();
  return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function nowISO(){
  var d = new Date();
  var p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

/* ===== table ===== */
function progCell(p){
  var w = el('div','pw');
  var bar = el('div','bar'+(p>=100?' full':''));
  var f = el('i'); f.style.width = Math.min(100,p||0)+'%';
  bar.appendChild(f); w.appendChild(bar);
  w.appendChild(el('span','pct',(p||0)+'%'));
  return w;
}
function dueCell(item){
  var td = el('td','c-due');
  if (item.due){
    var n = daysTo(item.due);
    var cls = (n < 0 && item.prog < 100) ? 'over' : (n <= 14 && item.prog < 100 ? 'soon' : '');
    var sp = el('span', cls, esc(fmtDue(item.due)));
    td.appendChild(sp);
  } else if (item.when){
    td.appendChild(el('span',null,esc(item.when)));
  } else td.textContent = '—';
  return td;
}
function lastStep(item){
  if (!item.log || !item.log.length) return '';
  var l = item.log[item.log.length-1];
  return (l.t ? l.t.split(',')[0] + ' · ' : '') + (l.d || '');
}
function buildTable(list, sec, grp){
  var wrap = el('div','tw');
  var tbl = document.createElement('table');
  var cols = [
    {k:'v', l:'Item', c:'h-name'},
    {k:'who', l:'Owner', c:'h-owner'},
    {k:'due', l:'Due', c:'h-due'},
    {k:'prog', l:'Progress', c:'h-prog'},
    {k:'step', l:'Last step', c:'h-step'}
  ];
  var thead = document.createElement('thead');
  var tr = document.createElement('tr');
  cols.forEach(function(c){
    var th = document.createElement('th');
    th.className = c.c;
    th.innerHTML = c.l + (sortBy===c.k ? '<span class="car">'+(sortDir>0?'▲':'▼')+'</span>' : '');
    th.addEventListener('click', function(){
      if (sortBy === c.k) sortDir = -sortDir; else { sortBy = c.k; sortDir = 1; }
      render();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);

  var tb = document.createElement('tbody');
  var rows = list.slice();
  if (sortBy !== 'none'){
    rows.sort(function(a,b){
      var av, bv;
      if (sortBy==='prog'){ av=a.prog||0; bv=b.prog||0; }
      else if (sortBy==='due'){ av = parseDue(a.due)? parseDue(a.due).getTime(): 8e15; bv = parseDue(b.due)? parseDue(b.due).getTime(): 8e15; }
      else if (sortBy==='step'){ av=(lastStep(a)||'').toLowerCase(); bv=(lastStep(b)||'').toLowerCase(); }
      else { av=(a[sortBy]||'').toString().toLowerCase(); bv=(b[sortBy]||'').toString().toLowerCase(); }
      return av<bv ? -sortDir : av>bv ? sortDir : 0;
    });
  }
  if (!rows.length){
    var er = el('tr','emptyrow');
    var td = document.createElement('td'); td.colSpan = 5; td.textContent = 'Nothing here yet.';
    er.appendChild(td); tb.appendChild(er);
  }
  rows.forEach(function(item){
    var r = document.createElement('tr');
    var n = el('td','c-name');
    var line = el('div');
    if (item.k) line.appendChild(el('span','tag', esc(item.k)));
    line.appendChild(el('span','nm', esc(item.v || 'Untitled')));
    n.appendChild(line);
    if (item.s) n.appendChild(el('div','nt', esc(item.s)));
    r.appendChild(n);
    r.appendChild(el('td','c-owner', item.who ? esc(item.who) : '—'));
    r.appendChild(dueCell(item));
    var p = el('td','c-prog'); p.appendChild(progCell(item.prog||0)); r.appendChild(p);
    r.appendChild(el('td','c-step', esc(lastStep(item)) || '—'));
    r.addEventListener('click', function(){ openRecord(item, list, sec, grp); });
    tb.appendChild(r);
  });
  tbl.appendChild(tb);
  wrap.appendChild(tbl);
  return wrap;
}

var qIdx = null;
function quoteList(){
  var out = [];
  data.sections.forEach(function(sec){
    if (sec.kind !== 'quotes') return;
    (sec.items||[]).forEach(function(it){ if ((it.v||'').trim()) out.push(it.v.trim()); });
  });
  return out;
}
function paintQuote(w){
  var box = w.querySelector('#heroQuote');
  var nx  = w.querySelector('#heroQNext');
  var list = quoteList();
  if (!list.length){
    nx.style.display = 'none';
    box.innerHTML = '';
    var b = el('button','hqempty','Add the quotes you actually return to \u2192'); b.type='button';
    b.addEventListener('click', function(){ var q=null; data.sections.forEach(function(x){ if(x.kind==='quotes') q=x; }); if(q){ view=q.id; render(); } });
    box.appendChild(b);
    return;
  }
  nx.style.display = list.length > 1 ? '' : 'none';
  if (qIdx === null){
    var d = new Date();
    qIdx = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
  }
  var txt = list[((qIdx % list.length) + list.length) % list.length];
  var m = txt.split(/\s+[\u2014\u2013-]{1,2}\s+/);
  var body = txt, who = '';
  if (m.length > 1){ who = m[m.length-1]; body = txt.slice(0, txt.length - who.length).replace(/\s*[\u2014\u2013-]{1,2}\s*$/,''); }
  box.innerHTML = '\u201C' + esc(body.replace(/^[\u201C\"]|[\u201D\"]$/g,'')) + '\u201D' +
    (who ? '<span class="hqa">\u2014 ' + esc(who) + '</span>' : '');
}
function spark(r, dur, begin, target){
  return '<circle class="spark" r="'+r+'" cx="0" cy="0">' +
    '<animateMotion dur="'+dur+'s" begin="'+begin+'" repeatCount="indefinite" rotate="auto">' +
      '<mpath href="'+target+'" xlink:href="'+target+'"/>' +
    '</animateMotion>' +
    '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="'+dur+'s" begin="'+begin+'" repeatCount="indefinite"/>' +
  '</circle>';
}

function renderToday(main){
  main.appendChild(heroEl());
  var head = el('div','phead');
  var t = el('div','ptitle');
  var d = new Date();
  t.appendChild(el('h1',null,'Today'));
  t.appendChild(el('div','psub', d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear() + ' · what needs your attention'));
  head.appendChild(t);
  main.appendChild(head);

  var tracked=0, sum=0, done=0, steps=0;
  var overdue=[], soon=[], stalled=[], acts=[];
  allItems(function(it, sec, grp, list){
    if (!(it.v||'').trim()) return;
    tracked++; sum += it.prog||0; if ((it.prog||0)>=100) done++;
    steps += (it.log||[]).length;
    var ref = {it:it, sec:sec, grp:grp, list:list};
    var n = daysTo(it.due);
    if (n !== null && it.prog < 100){
      if (n < 0) overdue.push(ref);
      else if (n <= 14) soon.push(ref);
    }
    var last = (it.log||[])[it.log.length-1];
    var lastIso = last && last.iso ? parseDue(last.iso) : null;
    var stale = !last || (lastIso && Math.round((today0()-lastIso)/86400000) > 21);
    if ((it.prog||0) > 0 && (it.prog||0) < 100 && stale) stalled.push(ref);
    (it.log||[]).forEach(function(e2){ acts.push({e:e2, it:it, sec:sec, grp:grp, list:list}); });
  });

  var stats = el('div','stats');
  function st(n,l,acc){
    var s = el('div','stat');
    s.appendChild(el('div','n'+(acc?' acc':''), n));
    s.appendChild(el('div','l', l));
    return s;
  }
  stats.appendChild(st(tracked,'Tracked'));
  stats.appendChild(st((tracked?Math.round(sum/tracked):0)+'%','Average progress',true));
  stats.appendChild(st(done,'Completed'));
  stats.appendChild(st(steps,'Steps logged'));
  main.appendChild(stats);

  function group(title, refs, note){
    if (!refs.length) return;
    var b = el('div','block');
    var h = el('div','bhead');
    h.appendChild(el('h2',null,title));
    h.appendChild(el('span','count', refs.length));
    h.appendChild(el('div','rule'));
    b.appendChild(h);
    if (note) b.appendChild(el('div','psub', note));
    b.appendChild(buildTable(refs.map(function(r){ return r.it; }), refs[0].sec, refs[0].grp));
    // rebind rows to their own section
    var trs = b.querySelectorAll('tbody tr');
    refs.forEach(function(r, i){
      if (!trs[i]) return;
      var clone2 = trs[i].cloneNode(true);
      trs[i].parentNode.replaceChild(clone2, trs[i]);
      clone2.addEventListener('click', function(){ openRecord(r.it, r.list, r.sec, r.grp); });
    });
    main.appendChild(b);
  }

  group('Overdue', overdue);
  group('Due in the next two weeks', soon);
  group('No movement', stalled, 'Started but nothing logged in the last three weeks.');

  if (acts.length){
    var b = el('div','block');
    var h = el('div','bhead');
    h.appendChild(el('h2',null,'Latest steps'));
    h.appendChild(el('div','rule'));
    b.appendChild(h);
    var tw = el('div','tw');
    var tbl = document.createElement('table');
    var tb = document.createElement('tbody');
    acts.slice(-8).reverse().forEach(function(a){
      var r = document.createElement('tr');
      r.appendChild(el('td','c-due', esc((a.e.t||'').split(',')[0])));
      var n = el('td','c-name');
      n.appendChild(el('div','nm', esc(a.e.d || '(no description)')));
      n.appendChild(el('div','nt', esc(a.it.v + ' · ' + a.sec.nav + (a.e.who ? ' · ' + a.e.who : ''))));
      r.appendChild(n);
      r.addEventListener('click', function(){ openRecord(a.it, a.list, a.sec, a.grp); });
      tb.appendChild(r);
    });
    tbl.appendChild(tb); tw.appendChild(tbl); b.appendChild(tw);
    main.appendChild(b);
  }

  if (!overdue.length && !soon.length && !stalled.length && !acts.length){
    main.appendChild(el('div','psub','Nothing needs attention. Add due dates to your entries and this page will fill itself.'));
  }
}

function renderSection(main, sec){
  var head = el('div','phead');
  var t = el('div','ptitle');
  var ti = document.createElement('input');
  ti.type='text'; ti.className='h1edit'; ti.value = sec.title || sec.nav;
  ti.addEventListener('input', function(){ sec.title = this.value; sec.nav = this.value; save(); renderTabs(); });
  var si = document.createElement('input');
  si.type='text'; si.className='subedit'; si.value = sec.sub || ''; si.placeholder='short description';
  si.addEventListener('input', function(){ sec.sub = this.value; save(); });
  t.appendChild(ti); t.appendChild(si);
  head.appendChild(t);

  var acts = el('div','pacts');
  if (sec.kind === 'groups'){
    var gb = el('button','btn ghost','+ Heading'); gb.type='button';
    gb.addEventListener('click', function(){
      ask({title:'Add a heading', body:'What should it be called?', input:true, ok:'Add heading'}).then(function(n){
        if(!n) return;
        sec.groups.push({title:n, items:[]}); saveNow(); render(); toast('Heading “'+n+'” added');
      });
    });
    acts.appendChild(gb);
  } else {
    var ab = el('button','btn','+ Add entry'); ab.type='button';
    ab.addEventListener('click', function(){
      var it = I(''); sec.items.push(it); saveNow(); render();
      openRecord(it, sec.items, sec, null);
    });
    acts.appendChild(ab);
  }
  var db = el('button','btn danger','Delete section'); db.type='button';
  db.addEventListener('click', function(){
    ask({title:'Delete “'+sec.nav+'”?', body:'This removes the section and everything inside it, including step logs.',
         ok:'Delete section', danger:true}).then(function(ok){
      if(!ok) return;
      var i = data.sections.indexOf(sec);
      data.sections.splice(i,1);
      view = 'today'; saveNow(); render(); toast('Section “'+sec.nav+'” deleted');
    });
  });
  acts.appendChild(db);
  head.appendChild(acts);
  main.appendChild(head);

  if (sec.kind === 'quotes'){
    (sec.items||[]).forEach(function(item, i){
      var c = el('div','quotecard');
      var q = document.createElement('textarea');
      q.className='q'; q.value = item.v || ''; q.placeholder='Write the quote';
      q.style.cssText = 'flex:1;border:none;background:none;outline:none;font-family:inherit;font-style:italic;color:var(--dim);font-size:14.5px;line-height:1.6;resize:vertical;';
      q.addEventListener('input', function(){ item.v = this.value; save(); });
      var x = el('button','xbtn','×'); x.type='button';
      x.addEventListener('click', function(){
        ask({title:'Delete this quote?', body:'“'+(item.v||'').slice(0,60)+'” will be removed.', ok:'Delete', danger:true})
        .then(function(ok){ if(!ok) return; sec.items.splice(i,1); saveNow(); render(); toast('Quote deleted'); });
      });
      c.appendChild(q); c.appendChild(x);
      main.appendChild(c);
    });
    var qa = el('button','btn','+ Add quote'); qa.type='button'; qa.style.marginTop='6px';
    qa.addEventListener('click', function(){ sec.items.push(I('')); saveNow(); render(); });
    main.appendChild(qa);
    return;
  }
  if (sec.kind === 'pills'){
    var pw = el('div','pillwrap');
    (sec.items||[]).forEach(function(item, i){
      var p = el('div','pillitem');
      var inp = document.createElement('input');
      inp.type='text'; inp.value = item.v||''; inp.placeholder='name';
      inp.style.cssText='border:none;background:none;outline:none;font-family:inherit;font-size:12px;color:var(--dim);width:'+Math.max(60,(item.v||'').length*7)+'px;';
      inp.addEventListener('input', function(){ item.v = this.value; save(); });
      var x = el('button','xbtn','×'); x.type='button';
      x.addEventListener('click', function(){
        ask({title:'Remove this?', body:'“'+(item.v||'')+'” will be removed.', ok:'Remove', danger:true})
        .then(function(ok){ if(!ok) return; sec.items.splice(i,1); saveNow(); render(); toast('Removed'); });
      });
      p.appendChild(inp); p.appendChild(x); pw.appendChild(p);
    });
    main.appendChild(pw);
    var pa = el('button','btn ghost','+ Add'); pa.type='button'; pa.style.marginTop='14px';
    pa.addEventListener('click', function(){ sec.items.push(I('')); saveNow(); render(); });
    main.appendChild(pa);
    return;
  }

  if (sec.kind === 'groups'){
    (sec.groups||[]).forEach(function(g){
      var b = el('div','block');
      var h = el('div','bhead');
      var gh = document.createElement('h2');
      gh.className='gedit'; gh.contentEditable='true'; gh.textContent = g.title;
      gh.addEventListener('input', function(){ g.title = this.textContent; save(); });
      h.appendChild(gh);
      h.appendChild(el('span','count', (g.items||[]).length));
      h.appendChild(el('div','rule'));
      var ga = el('button','btn ghost','+ Add'); ga.type='button';
      ga.addEventListener('click', function(){
        var it = I(''); g.items.push(it); saveNow(); render();
        openRecord(it, g.items, sec, g);
      });
      h.appendChild(ga);
      var gd = el('button','xbtn','×'); gd.type='button'; gd.title='Delete heading';
      gd.addEventListener('click', function(){
        ask({title:'Delete heading “'+g.title+'”?', body:'Everything listed under it will be removed too.',
             ok:'Delete heading', danger:true}).then(function(ok){
          if(!ok) return;
          sec.groups.splice(sec.groups.indexOf(g),1); saveNow(); render(); toast('Heading deleted');
        });
      });
      h.appendChild(gd);
      b.appendChild(h);
      b.appendChild(buildTable(g.items, sec, g));
      main.appendChild(b);
    });
    return;
  }

  main.appendChild(buildTable(sec.items, sec, null));
}

function render(){
  renderTabs();
  var main = document.getElementById('main');
  main.innerHTML = '';
  if (view === 'today'){ renderToday(main); return; }
  var sec = null;
  data.sections.forEach(function(s){ if (s.id === view) sec = s; });
  if (!sec){ view='today'; render(); return; }
  renderSection(main, sec);
}

/* ===== backup ===== */
document.getElementById('exportBtn').addEventListener('click', function(){
  saveNow();
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='avision-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Backup saved to your downloads');
});
document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
document.getElementById('fileInput').addEventListener('change', function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var inc;
    try { inc = JSON.parse(r.result); } catch(err){ toast('That file could not be read'); return; }
    if (!inc || !inc.sections){ toast('That is not an Avision backup'); return; }
    ask({title:'Restore from backup?', body:'Everything on this device will be replaced by the file contents.',
         ok:'Restore', danger:true}).then(function(ok){
      if(!ok) return;
      data = normalizeAll(inc); view='today'; saveNow(); render(); toast('Restored from backup');
    });
  };
  r.readAsText(f); e.target.value='';
});

/* ===== keys ===== */
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && drawer.classList.contains('show')) closeRecord();
  if (e.key==='Escape' && cWrap.classList.contains('show')) closeAsk(null);
});
window.addEventListener('beforeunload', saveNow);

render();
